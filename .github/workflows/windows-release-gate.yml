name: Windows release gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coremail-windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.246"
  CLAUDE_LEGACY_CODE_VERSION: "2.1.84"
  CLAUDE_NPM_NODE_VERSION: "24.19.0"

jobs:
  windows-powershell-51:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node for the npm Claude fixture
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.CLAUDE_NPM_NODE_VERSION }}

      - name: Run offline unit tests
        shell: powershell
        run: python -B -m unittest discover -s tests -v

      - name: Parse source PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failures = @()
          foreach ($script in (Get-ChildItem -LiteralPath . -Filter '*.ps1' -File -Recurse)) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($errorRecord in @($errors)) {
              $failures += "$($script.FullName): $($errorRecord.Message)"
            }
          }
          if ($failures.Count -gt 0) {
            throw "PowerShell parse failures:`n$($failures -join "`n")"
          }

      - name: Prepare exact native and npm Claude Code fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # These network installations exist only on the disposable online
          # release runner. INSTALL.cmd never installs or repairs Claude Code.
          & powershell.exe -NoLogo -NoProfile -Command `
            "& ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $env:CLAUDE_CODE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'The CI-only native Claude fixture failed to install.' }
          $nativeCandidates = @((Join-Path $env:USERPROFILE '.local\bin\claude.exe'))
          $nativeCommand = Get-Command claude.exe -ErrorAction SilentlyContinue
          if ($nativeCommand) { $nativeCandidates += $nativeCommand.Source }
          $nativeClaude = $nativeCandidates |
            Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -First 1
          if (-not $nativeClaude -or [IO.Path]::GetExtension($nativeClaude) -ine '.exe') {
            throw 'The native fixture did not produce claude.exe.'
          }
          $nativeVersion = ((& $nativeClaude --version 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or
              $nativeVersion -notmatch ('^' + [regex]::Escape($env:CLAUDE_CODE_VERSION) + '(?:\s|$)')) {
            throw "Expected native Claude $env:CLAUDE_CODE_VERSION; found $nativeVersion"
          }

          $npmRoot = Join-Path $env:RUNNER_TEMP 'coremail-npm-claude'
          npm.cmd install --global --prefix $npmRoot `
            "@anthropic-ai/claude-code@$env:CLAUDE_CODE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'The CI-only npm Claude fixture failed to install.' }
          $npmClaude = Join-Path $npmRoot 'claude.cmd'
          $npmNode = (Get-Command node.exe -CommandType Application -ErrorAction Stop |
            Select-Object -First 1).Source
          $npmVersion = ((& $npmClaude --version 2>&1) -join "`n").Trim()
          $npmExitCode = $LASTEXITCODE
          $nodeVersion = ((& $npmNode --version 2>&1) -join "`n").Trim()
          $nodeExitCode = $LASTEXITCODE
          if ($npmExitCode -ne 0 -or
              $npmVersion -notmatch ('^' + [regex]::Escape($env:CLAUDE_CODE_VERSION) + '(?:\s|$)')) {
            throw "Expected npm Claude $env:CLAUDE_CODE_VERSION; found $npmVersion"
          }
          if ($nodeExitCode -ne 0 -or $nodeVersion -ne "v$env:CLAUDE_NPM_NODE_VERSION") {
            throw "Expected npm Node v$env:CLAUDE_NPM_NODE_VERSION; found $nodeVersion"
          }
          $legacyNpmRoot = Join-Path $env:RUNNER_TEMP 'coremail-npm-claude-legacy'
          npm.cmd install --global --prefix $legacyNpmRoot `
            "@anthropic-ai/claude-code@$env:CLAUDE_LEGACY_CODE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'The CI-only legacy npm Claude fixture failed to install.' }
          $legacyNpmClaude = Join-Path $legacyNpmRoot 'claude.cmd'
          $legacyNpmVersion = ((& $legacyNpmClaude --version 2>&1) -join "`n").Trim()
          $legacyNpmExitCode = $LASTEXITCODE
          if ($legacyNpmExitCode -ne 0 -or
              $legacyNpmVersion -notmatch ('^' + [regex]::Escape($env:CLAUDE_LEGACY_CODE_VERSION) + '(?:\s|$)')) {
            throw "Expected legacy npm Claude $env:CLAUDE_LEGACY_CODE_VERSION; found $legacyNpmVersion"
          }
          "NATIVE_CLAUDE=$nativeClaude" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_CLAUDE=$npmClaude" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_NODE=$npmNode" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LEGACY_NPM_CLAUDE=$legacyNpmClaude" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DISABLE_AUTOUPDATER=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DISABLE_UPDATES=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CI-only native Claude: $nativeVersion"
          Write-Host "CI-only npm Claude: $npmVersion / $nodeVersion"
          Write-Host "CI-only legacy npm Claude: $legacyNpmVersion / $nodeVersion"

      - name: Prove source MCP and user-scope registration compatibility before packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonCommand = (Get-Command python.exe -ErrorAction Stop).Source
          & .\tests\smoke-mcp.ps1 -IgnoreAccountConfiguration -PythonExecutable $pythonCommand
          # smoke-mcp.ps1 is a PowerShell script, not a native executable. Its
          # success must be checked with `$?`; `$LASTEXITCODE` can still hold a
          # stale value from a previous native command in the runner process.
          if (-not $?) { throw 'Source MCP smoke test failed.' }
          $sourceRoot = (Get-Location).Path
          $registrar = Join-Path $sourceRoot 'scripts\register_claude_user_mcp.py'
          & $pythonCommand -B -I $registrar self-test
          if ($LASTEXITCODE -ne 0) { throw 'The user-scope registrar self-test failed.' }

          . .\scripts\windows-lifecycle-common.ps1
          . .\scripts\windows-tool-discovery.ps1
          $sourceInvocation = Resolve-ClaudeCodeInvocation -ExplicitPath $env:NATIVE_CLAUDE
          if ($null -eq $sourceInvocation) { throw 'The native Claude fixture could not be resolved.' }
          Invoke-CoremailClaudeChecked `
            -Invocation $sourceInvocation `
            -Arguments @('--version') `
            -Label 'Real Claude Code version probe'
          Invoke-CoremailClaudeChecked `
            -Invocation $sourceInvocation `
            -Arguments @('mcp', '--help') `
            -Label 'Real Claude user-scope MCP capability probe'

          # Claude Code 2.1.84 is a supported compatibility fixture. Exercise
          # the real Node-backed npm entry in an isolated user config, then
          # prove that registration and removal leave no Coremail entry behind.
          $legacyInvocation = Resolve-ClaudeCodeInvocation -ExplicitPath $env:LEGACY_NPM_CLAUDE
          if ($null -eq $legacyInvocation -or
              [string]$legacyInvocation.NpmBinKind -ne 'node') {
            throw 'The legacy Claude fixture did not resolve its package-declared Node entry point.'
          }
          $probeRoot = Join-Path $env:RUNNER_TEMP 'coremail-legacy-user-mcp-probe'
          New-Item -ItemType Directory -Path $probeRoot -Force | Out-Null
          $probeConfig = Join-Path $probeRoot '.claude.json'
          $probeBackup = Join-Path $probeRoot 'register.backup'
          $removeBackup = Join-Path $probeRoot 'remove.backup'
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $registrarArguments = @(
            '-B', '-I', $registrar, 'register',
            '--claude-executable', [string]$legacyInvocation.Executable,
            '--server-name', 'coremail-controller',
            '--user-config', $probeConfig,
            '--backup', $probeBackup,
            '--powershell-executable', $windowsPowerShell,
            '--server-script', (Join-Path $sourceRoot 'mcp\run-server.ps1')
          )
          foreach ($prefix in @($legacyInvocation.Prefix)) {
            $registrarArguments += @('--claude-prefix', [string]$prefix)
          }
          $previousClaudeConfigDir = [string]$env:CLAUDE_CONFIG_DIR
          $hadClaudeConfigDir = Test-Path Env:CLAUDE_CONFIG_DIR
          try {
            $env:CLAUDE_CONFIG_DIR = $probeRoot
            & $pythonCommand @registrarArguments
            if ($LASTEXITCODE -ne 0) { throw 'Claude 2.1.84 user-scope registration failed.' }
            & $pythonCommand -B -I $registrar verify `
              --server-name 'coremail-controller' `
              --user-config $probeConfig `
              --powershell-executable $windowsPowerShell `
              --server-script (Join-Path $sourceRoot 'mcp\run-server.ps1')
            if ($LASTEXITCODE -ne 0) { throw 'Claude 2.1.84 registration verification failed.' }
            $removeArguments = @(
              '-B', '-I', $registrar, 'unregister',
              '--claude-executable', [string]$legacyInvocation.Executable,
              '--server-name', 'coremail-controller',
              '--user-config', $probeConfig,
              '--backup', $removeBackup
            )
            foreach ($prefix in @($legacyInvocation.Prefix)) {
              $removeArguments += @('--claude-prefix', [string]$prefix)
            }
            & $pythonCommand @removeArguments
            if ($LASTEXITCODE -ne 0) { throw 'Claude 2.1.84 user-scope removal failed.' }
            if (Test-Path -LiteralPath $probeConfig -PathType Leaf) {
              $probePayload = Get-Content -LiteralPath $probeConfig -Raw | ConvertFrom-Json
              $probeServers = $probePayload.PSObject.Properties['mcpServers']
              if ($null -ne $probeServers -and
                  $null -ne $probeServers.Value.PSObject.Properties['coremail-controller']) {
                throw 'Claude 2.1.84 removal left the Coremail user entry behind.'
              }
            }
          }
          finally {
            if ($hadClaudeConfigDir) { $env:CLAUDE_CONFIG_DIR = $previousClaudeConfigDir }
            else { Remove-Item Env:CLAUDE_CONFIG_DIR -ErrorAction SilentlyContinue }
          }

      - name: Build and exercise the exact packaged Windows artifact
        shell: powershell
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP 'coremail-release-gated'
          python -B .\scripts\build-release.py `
            --output-dir $candidateRoot `
            --windows-gate `
            --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Windows-gated archive construction failed.' }

          $archives = @(Get-ChildItem -LiteralPath $candidateRoot -Filter '*.zip' -File)
          if ($archives.Count -ne 1 -or
              $archives[0].Name -ne 'coremail-controller-0.8.0-windows.zip') {
            throw 'Expected exactly the versioned gated ZIP.'
          }
          $archive = $archives[0]
          $testedArchiveHash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash
          $sidecarPath = "$($archive.FullName).sha256"
          $declaredHash = ((Get-Content -LiteralPath $sidecarPath -Raw).Trim() -split '\s+')[0]
          if ($declaredHash -ine $testedArchiveHash) {
            throw 'Release candidate checksum sidecar does not match the ZIP.'
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'coremail-release-extracted'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extractRoot
          $pluginRoots = @(Get-ChildItem -LiteralPath $extractRoot -Directory)
          if ($pluginRoots.Count -ne 1) { throw 'The release ZIP must contain exactly one plugin root.' }
          $pluginRoot = $pluginRoots[0].FullName
          python -B (Join-Path $pluginRoot 'scripts\verify-release.py') `
            $pluginRoot --require-windows-gate
          if ($LASTEXITCODE -ne 0) { throw 'Extracted internal integrity verification failed.' }

          $pythonCommand = (Get-Command python.exe -ErrorAction Stop).Source
          $orchestrator = Join-Path $pluginRoot 'tests\run-windows-release-gate.ps1'
          & $orchestrator `
            -PluginRoot $pluginRoot `
            -PythonCommand $pythonCommand `
            -ClaudeCommand $env:NATIVE_CLAUDE `
            -ScenarioName native
          & $orchestrator `
            -PluginRoot $pluginRoot `
            -PythonCommand $pythonCommand `
            -ClaudeCommand $env:NPM_CLAUDE `
            -NodeCommand $env:NPM_NODE `
            -ScenarioName npm

          $uploadArchiveHash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash
          if ($uploadArchiveHash -ine $testedArchiveHash) {
            throw 'The release candidate ZIP changed after lifecycle testing.'
          }
          "COREMAIL_RELEASE_DIR=$candidateRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload gated release
        uses: actions/upload-artifact@v7
        with:
          name: coremail-controller-windows-gated
          path: ${{ env.COREMAIL_RELEASE_DIR }}
          if-no-files-found: error

  publish-gated-files:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: windows-powershell-51
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out publication repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the gated artifact from this run
        uses: actions/download-artifact@v8
        with:
          name: coremail-controller-windows-gated
          path: ${{ runner.temp }}/coremail-gated-release

      - name: Verify and publish the exact gated files
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/coremail-gated-release"
          shopt -s nullglob
          archives=("${release_dir}"/*.zip)
          sidecars=("${release_dir}"/*.zip.sha256)
          if [[ ${#archives[@]} -ne 1 || ${#sidecars[@]} -ne 1 ]]; then
            echo 'Expected exactly one gated ZIP and one checksum sidecar.' >&2
            exit 1
          fi
          archive_name="$(basename "${archives[0]}")"
          sidecar_name="$(basename "${sidecars[0]}")"
          if [[ "${sidecar_name}" != "${archive_name}.sha256" ]]; then
            echo 'The gated ZIP and checksum sidecar names do not match.' >&2
            exit 1
          fi
          if [[ ! "${archive_name}" =~ ^coremail-controller-([0-9]+\.[0-9]+\.[0-9]+)-windows\.zip$ ]]; then
            echo 'The gated ZIP name does not contain a supported release version.' >&2
            exit 1
          fi
          release_version="${BASH_REMATCH[1]}"
          (cd "${release_dir}" && sha256sum -c "${sidecar_name}")

          extract_dir="${RUNNER_TEMP}/coremail-publish-verify"
          python -B -m zipfile -e "${archives[0]}" "${extract_dir}"
          plugin_root="$(find "${extract_dir}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python -B "${plugin_root}/scripts/verify-release.py" "${plugin_root}" --require-windows-gate

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin gated-release:gated-release; then
            git switch gated-release
          else
            git switch --orphan gated-release
          fi
          release_target="releases/${release_version}"
          mkdir -p "${release_target}"
          cp "${archives[0]}" "${release_target}/${archive_name}"
          cp "${sidecars[0]}" "${release_target}/${sidecar_name}"
          printf '%s\n' '*.zip binary' '*.sha256 -text' > .gitattributes
          printf '%s\n' "${GITHUB_SHA}" > "${release_target}/SOURCE_COMMIT"
          git add .gitattributes "${release_target}"
          if git diff --cached --quiet; then
            echo 'The gated release branch already contains these exact files.'
            exit 0
          fi
          git commit -m "release: publish gated ${release_version} from ${GITHUB_SHA}"
          git push origin gated-release
